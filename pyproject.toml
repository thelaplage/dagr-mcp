[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagr-mcp"
version = "0.1.0"
description = "MCP admission runtime and signed SRS receipt emitter"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.4,<47",
  "fastmcp>=3.4.4,<4",
  "rfc8785==0.1.4",
]

[project.scripts]
dagr-mcp-demo = "dagr_mcp.demo:main"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "jsonschema>=4.26,<5"]

[tool.setuptools.packages.find]
include = ["dagr_mcp*"]

[tool.setuptools.package-data]
dagr_mcp = ["vendor/srs/*.json", "vendor/srs/*.zip"]
