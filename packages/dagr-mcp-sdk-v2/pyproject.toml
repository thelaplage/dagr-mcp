[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dagr-mcp-sdk-v2"
version = "0.2.0"
description = "DAGR governed binding over the official Python MCP SDK, protocol 2026-07-28 (mcp==2.0.0)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vega Commons Project, Inc." }]
keywords = ["mcp", "receipt", "srs", "admission", "ed25519", "streamable-http"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "dagr-mcp-core",
  "mcp==2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "jsonschema>=4.26,<5", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dagr_mcp_sdk_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
