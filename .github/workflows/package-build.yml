name: package-build

# Non-publishing packaging guard: builds the wheel and sdist, validates the
# metadata, installs the wheel in a clean environment, and runs the minimum
# installed-command smoke. It never publishes: no index upload, no release, no
# tag, and no OIDC (`id-token: write`) permission is requested. This job does
# not change the FastMCP main allowed-failure canary posture defined in
# test.yml; it builds and smokes against the declared fastmcp>=3.4.4,<4 range.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Assert the official-sdk extra is pinned to the exact proven version
        # The built wheel's declared official-sdk requirement must be exactly
        # mcp==1.29.0 — the version proven by docs/OFFICIAL_MCP_SDK_BINDING.md, the
        # official-sdk CI lane, and the clean-wheel official-SDK smoke below. No
        # broader (untested) range is advertised.
        run: |
          python - <<'PY'
          import glob, re, zipfile
          from email.parser import Parser
          wheel = sorted(glob.glob("dist/*.whl"))[0]
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              meta = zf.read(name).decode("utf-8")
          reqs = Parser().parsestr(meta).get_all("Requires-Dist") or []
          official = []
          for line in reqs:
              req, _, marker = line.partition(";")
              if re.search(r'extra\s*==\s*[\'"]official-sdk[\'"]', marker):
                  official.append(re.sub(r"\s+", "", req))
          assert official == ["mcp==1.29.0"], (official, reqs)
          print("wheel official-sdk requirement OK:", official)
          PY
      - name: Install the built wheel in a fresh environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
      - name: Installed-command smoke
        run: |
          /tmp/smoke/bin/dagr-mcp --help
          /tmp/smoke/bin/python -c "import importlib.metadata as m; print('dagr-mcp', m.version('dagr-mcp'))"
      - name: Clean-wheel official-SDK in-process tools/list + tools/call smoke
        # Install the wheel WITH the official-sdk extra (pulling the pinned SDK) into
        # a separate clean env, then drive the second binding over the SDK's real
        # in-process transport. Run from /tmp so the installed wheel — not the repo
        # working tree — is exercised.
        run: |
          python -m venv /tmp/smoke-sdk
          /tmp/smoke-sdk/bin/python -m pip install --upgrade pip
          /tmp/smoke-sdk/bin/python -m pip install "$(ls dist/*.whl)[official-sdk]"
          cd /tmp && /tmp/smoke-sdk/bin/python "$GITHUB_WORKSPACE/tools/smoke_official_sdk.py"
