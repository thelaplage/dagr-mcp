name: package-build

# Non-publishing packaging guard: builds the wheel and sdist, validates the
# metadata, installs the wheel in a clean environment, and runs the minimum
# installed-command smoke. It never publishes: no index upload, no release, no
# tag, and no OIDC (`id-token: write`) permission is requested. This job does
# not change the FastMCP main allowed-failure canary posture defined in
# test.yml; it builds and smokes against the declared fastmcp>=3.4.4,<4 range.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Assert the official-sdk extra is pinned to the exact proven version
        # The built wheel's declared official-sdk requirement must be exactly
        # mcp==1.29.0 — the version proven by docs/OFFICIAL_MCP_SDK_BINDING.md, the
        # official-sdk CI lane, and the clean-wheel official-SDK smoke below. No
        # broader (untested) range is advertised.
        run: |
          python - <<'PY'
          import glob, re, zipfile
          from email.parser import Parser
          wheel = sorted(glob.glob("dist/*.whl"))[0]
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              meta = zf.read(name).decode("utf-8")
          reqs = Parser().parsestr(meta).get_all("Requires-Dist") or []
          official = []
          for line in reqs:
              req, _, marker = line.partition(";")
              if re.search(r'extra\s*==\s*[\'"]official-sdk[\'"]', marker):
                  official.append(re.sub(r"\s+", "", req))
          assert official == ["mcp==1.29.0"], (official, reqs)
          print("wheel official-sdk requirement OK:", official)
          PY
      - name: Install the built wheel in a fresh environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
      - name: Installed-command smoke
        run: |
          /tmp/smoke/bin/dagr-mcp --help
          /tmp/smoke/bin/python -c "import importlib.metadata as m; print('dagr-mcp', m.version('dagr-mcp'))"
      - name: Clean-wheel official-SDK in-process tools/list + tools/call smoke
        # Install the wheel WITH the official-sdk extra (pulling the pinned SDK) into
        # a separate clean env, then drive the second binding over the SDK's real
        # in-process transport. Run from /tmp so the installed wheel — not the repo
        # working tree — is exercised.
        run: |
          python -m venv /tmp/smoke-sdk
          /tmp/smoke-sdk/bin/python -m pip install --upgrade pip
          /tmp/smoke-sdk/bin/python -m pip install "$(ls dist/*.whl)[official-sdk]"
          cd /tmp && /tmp/smoke-sdk/bin/python "$GITHUB_WORKSPACE/tools/smoke_official_sdk.py"

  # Builds and clean-installs the two new, dependency-isolated distributions
  # (dagr-mcp-core, dagr-mcp-sdk-v2) SEPARATELY from the root package's build
  # above -- they are independent distributions with their own pyproject.toml,
  # not extras of dagr-mcp. Never installs the root dagr-mcp / fastmcp / mcp<2
  # alongside dagr-mcp-sdk-v2 in the same env. See
  # docs/CORE_EXTRACTION_FORK.md and docs/DAGR_MCP_SDK_V2_BINDING.md.
  build-core-and-sdk-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build dagr-mcp-core wheel and sdist
        run: python -m build --sdist --wheel --outdir dist/core packages/dagr-mcp-core
      - name: Build dagr-mcp-sdk-v2 wheel and sdist
        run: python -m build --sdist --wheel --outdir dist/sdk-v2 packages/dagr-mcp-sdk-v2
      - name: Check metadata
        run: python -m twine check dist/core/* dist/sdk-v2/*
      - name: Assert dagr-mcp-sdk-v2's mcp dependency is pinned to exactly 2.0.0 and it never depends on fastmcp
        run: |
          python - <<'PY'
          import glob, re, zipfile
          from email.parser import Parser
          wheel = sorted(glob.glob("dist/sdk-v2/*.whl"))[0]
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              meta = zf.read(name).decode("utf-8")
          reqs = [re.sub(r"\s+", "", r) for r in (Parser().parsestr(meta).get_all("Requires-Dist") or [])]
          assert "mcp==2.0.0" in reqs, reqs
          assert not any(r.lower().startswith("fastmcp") for r in reqs), reqs
          print("wheel dagr-mcp-sdk-v2 requirements OK:", reqs)
          PY
      - name: Inventory every wheel and sdist member
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          for path in sorted(glob.glob("dist/core/*") + glob.glob("dist/sdk-v2/*")):
              print(f"--- {path} ---")
              if path.endswith(".whl"):
                  with zipfile.ZipFile(path) as zf:
                      for n in sorted(zf.namelist()):
                          print(" ", n)
              else:
                  with tarfile.open(path) as tf:
                      for n in sorted(tf.getnames()):
                          print(" ", n)
          PY
      - name: Install dagr-mcp-core alone in a clean env; assert mcp/fastmcp absent
        run: |
          python -m venv /tmp/smoke-core
          /tmp/smoke-core/bin/python -m pip install --upgrade pip
          /tmp/smoke-core/bin/python -m pip install dist/core/*.whl
          /tmp/smoke-core/bin/python -c "
          import sys
          for name in ('mcp', 'fastmcp'):
              try:
                  __import__(name)
              except ModuleNotFoundError:
                  print(name, 'absent: OK')
              else:
                  print(name, 'UNEXPECTEDLY IMPORTABLE', file=sys.stderr); sys.exit(1)
          import dagr_mcp_core
          from dagr_mcp_core.lifecycle.core import plan_admission
          from dagr_mcp_core.lifecycle.models import AdmissionRequest
          assert plan_admission(AdmissionRequest(disposition='admitted')).execution_proceeds
          print('dagr-mcp-core installed-wheel smoke OK')
          "
      - name: Install dagr-mcp-core + dagr-mcp-sdk-v2 in a clean env; assert fastmcp absent and mcp==2.0.0
        run: |
          python -m venv /tmp/smoke-sdk-v2
          /tmp/smoke-sdk-v2/bin/python -m pip install --upgrade pip
          /tmp/smoke-sdk-v2/bin/python -m pip install dist/core/*.whl dist/sdk-v2/*.whl httpx uvicorn jsonschema
          /tmp/smoke-sdk-v2/bin/python -c "
          import sys
          from importlib.metadata import version
          try:
              import fastmcp
              print('fastmcp UNEXPECTEDLY IMPORTABLE', file=sys.stderr); sys.exit(1)
          except ModuleNotFoundError:
              print('fastmcp absent: OK')
          v = version('mcp')
          assert v == '2.0.0', v
          print('mcp pin OK', v)
          "
      - name: Genuine stateless HTTP proof from the installed wheels
        # Run from /tmp (not the repo working tree) so dagr_mcp_core /
        # dagr_mcp_sdk_v2 are exercised from the installed wheels, never a
        # source-tree shadow import. The proof script itself (and the schema /
        # verifier fixtures it reads) still comes from the checkout, matching
        # the existing tools/smoke_official_sdk.py convention above.
        run: |
          cd /tmp && /tmp/smoke-sdk-v2/bin/python "$GITHUB_WORKSPACE/examples/http_proof_v2/client_proof.py"
