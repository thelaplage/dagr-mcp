name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            fastmcp-spec: 'fastmcp==3.4.4'
            lane: fastmcp-3.4.4
            allow-failure: false
          - python-version: '3.12'
            fastmcp-spec: 'fastmcp==3.4.4'
            lane: fastmcp-3.4.4
            allow-failure: false
          - python-version: '3.13'
            fastmcp-spec: 'fastmcp==3.4.4'
            lane: fastmcp-3.4.4
            allow-failure: false
          - python-version: '3.13'
            fastmcp-spec: 'fastmcp>=3.4.4,<4'
            lane: fastmcp-latest-3
            allow-failure: false
          - python-version: '3.13'
            fastmcp-spec: 'fastmcp @ git+https://github.com/PrefectHQ/fastmcp@main'
            lane: fastmcp-main-canary
            allow-failure: true
    name: ${{ matrix.lane }} / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]' '${{ matrix.fastmcp-spec }}'
      - run: python -c "import fastmcp, sys; print('lane=${{ matrix.lane }}'); print('python=' + sys.version.split()[0]); print('fastmcp=' + getattr(fastmcp, '__version__', 'unknown'))"
      - name: Verify committed FastMCP fixtures
        if: ${{ matrix.fastmcp-spec == 'fastmcp==3.4.4' && matrix.python-version == '3.13' }}
        run: python tools/generate_fastmcp_fixtures.py --check
      - run: pytest -q
      - run: python3 tools/check_public_release.py .
