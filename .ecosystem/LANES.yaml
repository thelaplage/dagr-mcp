schema: "https://schemas.arcs.dev/ecosystem/ecosystem.lanes.v0.1.schema.json"
schema_version: "0.1"
repository: "dagr-mcp"
lanes:
  - lane_id: "dagr-mcp-ecosystem-declarations-pilot-v0-1"
    status: "complete"
    owner:
      name: "dagr-mcp maintainers"
    start_date: "2026-08-02"
    objective: >-
      Adopt a repository-local .ecosystem/ declaration tree in dagr-mcp that
      projects current repository bytes into the finalized arcs-ecosystem-kit
      v0.1 schema shape, without changing runtime, receipt, policy, MCP,
      FastMCP, Amnesiac, service, or verifier behavior.
    repositories_touched:
      - "dagr-mcp"
    capabilities_touched:
      - "TOOL_EXECUTION"
      - "RESOURCE_READ"
      - "EXTERNAL_ACTION"
      - "CREDENTIALED_ACTION"
      - "MEMORY_PROPOSE"
      - "MEMORY_RECORD_OUTCOME"
      - "MEMORY_COMPILE_CONTEXT"
      - "MEMORY_REQUEST_REOPENING"
      - "MEMORY_ADMIT"
    contracts_touched:
      - "dagr.mcp.lifecycle_contract"
      - "dagr.mcp.lifecycle_binding_mask"
      - "srs.mcp.sdk_enforcement"
      - "arcs.verify.report.v0_2"
      - "dagr.mcp.gateway_service_contract"
      - "dagr.amnesiac_optional_tools"
    produced_artifacts:
      - artifact_id: "ecosystem-declarations"
        artifact_type: "schema"
        path_or_ref: ".ecosystem/"
        claim_status: "validated"
      - artifact_id: "ecosystem-pilot-adjudication"
        artifact_type: "document"
        path_or_ref: "docs/ECOSYSTEM_PILOT_ADJUDICATION.md"
        claim_status: "validated"
      - artifact_id: "ecosystem-declaration-tests"
        artifact_type: "test"
        path_or_ref: "tests/test_ecosystem_declarations.py"
        claim_status: "validated"
    consumed_upstream_work:
      - work_id: "ARCS_CONSTITUTIONAL_LAYER_MODEL_v0_1"
        semantic_authority: "arcs-ecosystem-kit"
        claim_status: "partial"
        notes: "Proposed, unratified input."
      - work_id: "GARP_DOCTRINE_COMPATIBILITY"
        semantic_authority: "arcs-ecosystem-kit"
        claim_status: "validated"
        notes: "Compatibility layer over existing garp-doctrine discipline."
      - work_id: "SCHEMA_IDENTIFIER_NAMESPACE_ADR_0001"
        semantic_authority: "arcs-ecosystem-kit"
        claim_status: "validated"
        notes: "Accepted in the kit lane for PR 1 schema identifiers."
    overlap_keys:
      - "repository_classification"
      - "capability_mapping"
      - "contract_declarations"
      - "dependency_declarations"
      - "verifier_boundary"
      - "conformance_modeling"
    blockers: []
    downstream_blocks: []
    expected_completion_milestone: "repository-local ecosystem declarations adopted"
    completion_gates:
      - gate_id: "focused-ecosystem-declaration-tests"
        description: "Schema-backed declaration tests pass."
        status: "passed"
      - gate_id: "full-existing-tests"
        description: "Full repository test suite passes in the isolated environment."
        status: "passed"
      - gate_id: "public-release-guard"
        description: "Public-release guard passes."
        status: "passed"
    notes: >-
      This lane does not touch runtime behavior, receipt semantics, SRS
      profiles, ARCS Verify, or package dependencies. An earlier, unmerged
      local branch (feat/ecosystem-doctrine-pilot-v0-1, no open PR) drafted an
      equivalent declaration tree from the same repository base
      (653946d60c6f34625008992c80daadceb5a58652) and was the source the
      arcs-ecosystem-kit pilot fixture imported; this lane re-verifies that
      content against live repository bytes, corrects one drifted claim (the
      dagr-mcp-core dependency pin), and lands it on the currently designated
      branch instead of leaving two divergent unmerged trees.
  - lane_id: "dagr-mcp-layer-declaration-v0-1"
    status: "review"
    owner:
      name: "dagr-mcp maintainers"
    start_date: "2026-08-03"
    objective: >-
      Extend the Aug-02 .ecosystem/ declaration tree to reconcile against live
      repository bytes after the merged F0 first-run proof harness (PR #27)
      and confirm the Constitutional Layer Model v0.1 projection already
      adopted in the ecosystem-declarations-pilot lane (L3 runtime and policy
      implementation, L4 evidence production, L5 product and protocol
      adapters). Declaration-only: no runtime, receipt, policy, MCP, FastMCP,
      SDK-binding, Amnesiac, service, or verifier behavior changes.
    repositories_touched:
      - "dagr-mcp"
    capabilities_touched:
      - "TOOL_EXECUTION"
    contracts_touched:
      - "dagr.mcp.lifecycle_contract"
      - "srs.mcp.sdk_enforcement.admission_emission"
      - "srs.mcp.sdk_enforcement.outcome_emission"
    produced_artifacts:
      - artifact_id: "conformance-first-run-proof-gate"
        artifact_type: "schema"
        path_or_ref: ".ecosystem/CONFORMANCE_PROJECTION.yaml"
        claim_status: "validated"
      - artifact_id: "first-run-proof-pack-ref"
        artifact_type: "test"
        path_or_ref: "tests/test_first_run_proof.py"
        claim_status: "validated"
    consumed_upstream_work:
      - work_id: "dagr-mcp-ecosystem-declarations-pilot-v0-1"
        semantic_authority: "dagr-mcp"
        claim_status: "validated"
        notes: "Prior lane already adopted the L3/L5 primary/secondary constitutional_layers projection in ARCHITECTURE_PASSPORT.yaml and REPOSITORY.yaml; this lane reconciles it against bytes added after that lane closed."
    overlap_keys:
      - "conformance_modeling"
      - "layer_projection"
    blockers: []
    downstream_blocks: []
    expected_completion_milestone: "declaration tree reconciled to post-F0 live bytes with layer projection confirmed"
    completion_gates:
      - gate_id: "focused-ecosystem-declaration-tests"
        description: "Schema-backed declaration tests pass against the pinned sibling arcs-ecosystem-kit checkout."
        status: "passed"
      - gate_id: "full-existing-tests"
        description: "Full repository test suite passes in the isolated environment."
        status: "passed"
      - gate_id: "public-release-guard"
        description: "Public-release guard passes."
        status: "passed"
    notes: >-
      The L3/L4/L5 constitutional-layer projection (constitutional_layers,
      secondary_implementation_roles, per-concern constitutional_layer fields
      across AUTHORITY_REFERENCES.yaml, BOUNDARIES.yaml,
      CAPABILITY_BINDINGS.yaml, CONTRACT_BINDINGS.yaml, and
      RESPONSIBILITIES.yaml) was already adopted by the prior
      ecosystem-declarations-pilot lane and is unchanged here. This lane's
      only content change is recording the F0 first-run proof harness
      (dagr_mcp/first_run_demo.py, tests/test_first_run_proof.py, merged as
      362f7a5 / PR #27) as new L4 evidence: one CONFORMANCE_PROJECTION.yaml
      passed_gate, one proof_pack_ref (assertion_status recorded_end_to_end,
      not independently_verified or validated, since it is single-repository
      and has no cross-repo or independent-verifier counterpart yet), and one
      evidence_ref. No LAYER_CATALOG.yaml is added, consistent with the prior
      lane's finding that it is not part of the kit's own pilot declaration
      set. No kit fixture drift was found against arcs-ecosystem-kit @
      20a9937d286911eb128bb015f6ab081b7f04e9d7 (unchanged since the prior
      lane).
