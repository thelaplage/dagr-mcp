schema: "https://schemas.arcs.dev/ecosystem/ecosystem.compatibility-projection.v0.1.schema.json"
schema_version: "0.1"
repository: "dagr-mcp"
native_registry_refs:
  - id: "binding-version-registry"
    path: "docs/BINDING_VERSIONS.md"
    authority: "dagr-mcp"
    summary_role: "Repository-local binding identifier registry."
  - id: "sdk-v2-isolation"
    path: "docs/DAGR_MCP_SDK_V2_BINDING.md"
    authority: "dagr-mcp"
    summary_role: "Official MCP SDK 2.x isolated binding environment."
arcs_profiles: []
srs_profiles:
  - id: "srs.mcp.sdk_enforcement"
    version: "v0.1"
    semantic_authority: "arcs-srs"
    relationship: "consumes"
    assertion_status: "validated"
    authority_repository: "arcs-srs"
    authority_artifact_ref: "docs/profiles/SRS_MCP_SDK_ENFORCEMENT_PROFILE_v0_1.md"
    authority_version: "v0.1"
    evidence_refs:
      - id: "profile-byte-facts"
        path: "dagr_mcp/srs_receipts.py"
        authority: "dagr-mcp"
        relationship: "emits"
    integrity: {}
    notes: "Profile ID and profile version are emitted as current implementation byte facts."
  - id: "srs.core.v5.1"
    version: "v5.1"
    semantic_authority: "arcs-srs"
    relationship: "deprecated_reference"
    assertion_status: "deprecated_reference"
    authority_repository: "arcs-srs"
    authority_artifact_ref: "schemas/srs-envelope/"
    authority_version: "internal-pre-public"
    evidence_refs:
      - id: "receipt-version-byte-fact"
        path: "dagr_mcp/srs_receipts.py"
        authority: "dagr-mcp"
        relationship: "emits"
    integrity: {}
    historical_reference: true
    notes: "Internal/pre-public lineage value emitted by current implementation; not a public release claim."
governed_action_model_versions:
  - id: "governed-action-protocol-authority"
    version: "v0.1"
    semantic_authority: "unresolved"
    relationship: "partial"
    assertion_status: "partial"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: ".ecosystem/AUTHORITY_REFERENCES.yaml"
    authority_version: "v0.1"
    evidence_refs:
      - id: "unresolved-governed-action-authority"
        path: ".ecosystem/AUTHORITY_REFERENCES.yaml"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
    notes: "Current evidence does not establish a ratified L2 owner."
host_product_versions:
  - product: "fastmcp"
    version: "v3.4.4"
    semantic_authority: "fastmcp"
    relationship: "consumes"
    assertion_status: "validated"
    authority_repository: "fastmcp"
    authority_artifact_ref: "pyproject.toml"
    authority_version: ">=3.4.4,<4"
    evidence_refs:
      - id: "fastmcp-constraint"
        path: "pyproject.toml"
        authority: "dagr-mcp"
        relationship: "consumes"
    integrity: {}
    notes: "Lower bound recorded for schema version field; actual constraint is a range."
  - product: "official MCP Python SDK"
    version: "v1.29.0"
    semantic_authority: "modelcontextprotocol/python-sdk"
    relationship: "consumes"
    assertion_status: "validated"
    authority_repository: "modelcontextprotocol/python-sdk"
    authority_artifact_ref: "pyproject.toml"
    authority_version: "1.29.0"
    evidence_refs:
      - id: "official-sdk-v1-constraint"
        path: "pyproject.toml"
        authority: "dagr-mcp"
        relationship: "consumes"
    integrity: {}
  - product: "official MCP Python SDK"
    version: "v2.0.0"
    semantic_authority: "modelcontextprotocol/python-sdk"
    relationship: "consumes"
    assertion_status: "validated"
    authority_repository: "modelcontextprotocol/python-sdk"
    authority_artifact_ref: "packages/dagr-mcp-sdk-v2/pyproject.toml"
    authority_version: "2.0.0"
    evidence_refs:
      - id: "official-sdk-v2-constraint"
        path: "packages/dagr-mcp-sdk-v2/pyproject.toml"
        authority: "dagr-mcp"
        relationship: "consumes"
    integrity: {}
adapter_versions:
  - product: "direct-harness"
    version: "v0.1"
    semantic_authority: "dagr-mcp"
    relationship: "implements"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "docs/BINDING_VERSIONS.md"
    authority_version: "v0.1"
    evidence_refs:
      - id: "binding-registry"
        path: "docs/BINDING_VERSIONS.md"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
  - product: "fastmcp.middleware"
    version: "v0.1"
    semantic_authority: "dagr-mcp"
    relationship: "implements"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "docs/BINDING_VERSIONS.md"
    authority_version: "v0.1"
    evidence_refs:
      - id: "fastmcp-binding-registry"
        path: "docs/BINDING_VERSIONS.md"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
  - product: "official-mcp-sdk.python"
    version: "v0.1"
    semantic_authority: "dagr-mcp"
    relationship: "implements"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "docs/OFFICIAL_MCP_SDK_BINDING.md"
    authority_version: "v0.1"
    evidence_refs:
      - id: "official-sdk-binding-v1"
        path: "docs/OFFICIAL_MCP_SDK_BINDING.md"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
  - product: "official-mcp-sdk.python"
    version: "v0.2"
    semantic_authority: "dagr-mcp"
    relationship: "implements"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "docs/DAGR_MCP_SDK_V2_BINDING.md"
    authority_version: "v0.2"
    evidence_refs:
      - id: "official-sdk-binding-v2"
        path: "docs/DAGR_MCP_SDK_V2_BINDING.md"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
verifier_versions:
  - product: "arcs-verify dagr-srs report"
    version: "v0.2"
    semantic_authority: "arcs-verify"
    relationship: "validates"
    assertion_status: "validated"
    authority_repository: "arcs-verify"
    authority_artifact_ref: "arcs_verify/contracts/dagr-srs-verification-report-v0-2/README.md"
    authority_version: "v0.2"
    evidence_refs:
      - id: "arcs-verify-v0-2-acceptance"
        path: "packages/dagr-mcp-sdk-v2/tests/test_arcs_verify_v0_2_acceptance.py"
        authority: "dagr-mcp"
        relationship: "validates"
    integrity: {}
backward_compatibility:
  - scope: "root FastMCP compatibility path"
    from_version: "v0.1"
    to_version: "v0.1"
    relationship: "validates"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "docs/FASTMCP_CORE_REBINDING.md"
    authority_version: "v0.1"
    evidence_refs:
      - id: "fastmcp-core-rebinding"
        path: "docs/FASTMCP_CORE_REBINDING.md"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
    notes: "Legacy FastMCP compatibility remains active."
  - scope: "protocol-neutral core extraction"
    from_version: "v0.1"
    to_version: "v0.2"
    relationship: "validates"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "docs/CORE_EXTRACTION_FORK.md"
    authority_version: "v0.2"
    evidence_refs:
      - id: "core-byte-parity"
        path: "tests/test_core_extraction_byte_parity.py"
        authority: "dagr-mcp"
        relationship: "validates"
    integrity: {}
unsupported_versions:
  - scope: "root distribution co-installed with MCP SDK 2.x"
    version: "v2.0.0"
    reason: "Root FastMCP/mcp 1.x environment and isolated SDK v2 package are intentionally separate."
    relationship: "not_applicable"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "docs/DAGR_MCP_SDK_V2_BINDING.md"
    authority_version: "v0.2"
    evidence_refs:
      - id: "sdk-v2-isolation-doc"
        path: "docs/DAGR_MCP_SDK_V2_BINDING.md"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
migration_notes:
  - scope: "receipt cardinality"
    note: "Receipt cardinality remains conditional and bounded; admitted calls may produce admission plus outcome receipts, refused/deferred calls do not execute, and sink failures can create local gap behavior."
    relationship: "projects"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "README.md"
    authority_version: "v0.1"
    evidence_refs:
      - id: "readme-cardinality"
        path: "README.md"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
  - scope: "decision vocabulary"
    note: "Runtime policy values allow, deny, gate, defer, and fail_closed are not the SRS receipt dispositions admitted, refused, and deferred_for_review."
    relationship: "projects"
    assertion_status: "validated"
    authority_repository: "dagr-mcp"
    authority_artifact_ref: "dagr_mcp/enforcement_harness.py"
    authority_version: "v0.1"
    evidence_refs:
      - id: "policy-vocabulary"
        path: "dagr_mcp/enforcement_harness.py"
        authority: "dagr-mcp"
        relationship: "projects"
    integrity: {}
  - scope: "schema validation"
    note: "The declarations are validated against a sibling arcs-ecosystem-kit checkout; the kit is not added as a runtime package dependency."
    relationship: "validates"
    assertion_status: "validated"
    authority_repository: "arcs-ecosystem-kit"
    authority_artifact_ref: "schemas/"
    authority_version: "v0.1"
    evidence_refs:
      - id: "ecosystem-declaration-tests"
        path: "tests/test_ecosystem_declarations.py"
        authority: "dagr-mcp"
        relationship: "validates"
    integrity: {}
ownership_transitions:
  - current_owner: "dagr-mcp"
    candidate_owner: "dagr-workbench"
    candidate_verified: false
    migration_authorized: false
    migration_record_ref: "none"
