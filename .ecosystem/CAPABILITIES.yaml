schema_ref: arcs.ecosystem.capabilities.provisional.v0.1
schema_status: provisional_pending_arcs_ecosystem_kit
declaration_id: dagr-mcp.capabilities
declaration_kind: capabilities
repository_identity:
  name: dagr-mcp
  canonical_repo: thelaplage/dagr-mcp
capability_semantics:
  canonical_semantic_owner: defined_elsewhere
  ownership_note: >-
    This repository maps current behavior to a small provisional vocabulary. It
    does not own canonical ecosystem capability semantics.
capability_bindings:
  declaration: .ecosystem/CAPABILITY_BINDINGS.yaml
  canonical_capability_definitions: not_claimed
  binding_note: >-
    Binding details reference GARP SDK, SRS, ARCS Verify, Workbench, Amnesiac,
    and Countervail vocabulary surfaces without redefining them here.
capabilities:
  - id: TOOL_EXECUTION
    semantic_authority: defined_elsewhere
    implementation_role: implemented_here
    implementation_status: validated
    product_native_mapping:
      - governed MCP tools/call execution through configured binding
      - refused and deferred calls stopped before execution
    evidence:
      - dagr_mcp/fastmcp_binding.py
      - dagr_mcp_sdk_binding/adapter.py
      - packages/dagr-mcp-sdk-v2/src/dagr_mcp_sdk_v2/adapter.py
      - tests/test_fastmcp_binding.py
      - tests/test_official_mcp_sdk_binding.py
      - packages/dagr-mcp-sdk-v2/tests/test_acceptance_matrix.py
  - id: RESOURCE_READ
    semantic_authority: defined_elsewhere
    implementation_role: partially_mapped_here
    implementation_status: partial
    product_native_mapping:
      - read-class tool calls
      - custody vocabulary includes mcp_resource_read
    limitation: no general MCP resource/read binding is claimed as implemented
    evidence:
      - dagr_mcp_lifecycle/contract.py
      - dagr_mcp/mcp_record_custody_gateway.py
      - tests/golden/behavioral_freeze/custody_projections.json
  - id: EXTERNAL_ACTION
    semantic_authority: defined_elsewhere
    implementation_role: partially_mapped_here
    implementation_status: partial
    product_native_mapping:
      - enforcement harness tool class
      - remote connector can call configured external MCP targets
    limitation: not a canonical capability class in the SRS profile
    evidence:
      - dagr_mcp/enforcement_harness.py
      - dagr_mcp_service/connectors/remote.py
  - id: CREDENTIALED_ACTION
    semantic_authority: defined_elsewhere
    implementation_role: partially_mapped_here
    implementation_status: partial
    product_native_mapping:
      - remote connector credential provider path
      - credential values excluded from responses and receipts
    limitation: credential semantics are connector behavior, not canonical policy ownership
    evidence:
      - dagr_mcp_service/connectors/remote.py
      - tests/test_gateway_service_remote_connector.py
      - tests/test_gateway_service_remote_integration.py
  - id: MEMORY_PROPOSE
    semantic_authority: arcs_amnesiac
    implementation_role: implemented_here_as_optional_adapter_exposure
    implementation_status: validated
    product_native_mapping:
      - amnesiac.propose_candidates
    limitation: proposal is not memory admission
    evidence:
      - docs/AMNESIAC_TOOLS.md
      - dagr_mcp/amnesiac_contracts.py
      - dagr_mcp/amnesiac_native.py
      - tests/test_amnesiac_contracts.py
  - id: MEMORY_ADMIT
    semantic_authority: arcs_amnesiac
    implementation_role: explicitly_unowned_here
    implementation_status: not_implemented_here
    product_native_mapping: []
    limitation: DAGR does not admit claims into durable memory
    evidence:
      - README.md
      - docs/PRODUCT_ARCHITECTURE.md
      - docs/AMNESIAC_TOOLS.md
  - id: MEMORY_RECORD_OUTCOME
    semantic_authority: arcs_amnesiac
    implementation_role: implemented_here_as_optional_adapter_exposure
    implementation_status: validated
    product_native_mapping:
      - amnesiac.record_outcome
    limitation: refs-only bridge; no raw model output or claim body accepted
    evidence:
      - docs/AMNESIAC_TOOLS.md
      - dagr_mcp/amnesiac_contracts.py
      - dagr_mcp/amnesiac_native.py
      - tests/test_amnesiac_native.py
  - id: MEMORY_COMPILE_CONTEXT
    semantic_authority: arcs_amnesiac
    implementation_role: implemented_here_as_optional_adapter_exposure
    implementation_status: partial
    product_native_mapping:
      - amnesiac.compile_context
    limitation: deterministic reference selector v0, not the full governed context planner
    evidence:
      - docs/AMNESIAC_TOOLS.md
      - docs/GOVERNED_MEMORY_DEMO.md
      - dagr_mcp/amnesiac_native.py
  - id: MEMORY_REQUEST_REOPENING
    semantic_authority: arcs_amnesiac
    implementation_role: implemented_here_as_optional_adapter_exposure
    implementation_status: validated
    product_native_mapping:
      - amnesiac.request_reopening
    limitation: request only; caller cannot force reopening
    evidence:
      - docs/AMNESIAC_TOOLS.md
      - dagr_mcp/amnesiac_native.py
