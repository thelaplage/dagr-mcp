schema: "https://schemas.arcs.dev/ecosystem/ecosystem.conformance-projection.v0.1.schema.json"
schema_version: "0.1"
repository: "dagr-mcp"
standard_identifier: "arcs.ecosystem.conformance_projection"
standard_version: "v0.1"
declared_conformance_level: "C"
status: "partial"
relationship: "projects"
assertion_status: "validated"
authority_repository: "arcs-ecosystem-kit"
authority_artifact_ref: "docs/SCHEMA_CATALOG.md"
authority_version: "v0.1"
native_registry_refs:
  - id: "behavioral-freeze"
    path: "docs/BEHAVIORAL_FREEZE.md"
    authority: "dagr-mcp"
    summary_role: "Repository-native behavioral freeze and receipt lifecycle evidence."
  - id: "public-release-guard"
    path: "tools/check_public_release.py"
    authority: "dagr-mcp"
    summary_role: "Public-release guard preserved by the pilot."
passed_gates:
  - gate_id: "evidence_conformance_PASS"
    description: "Signed metadata-only receipts, trust bundles, raw-content exclusion, and gap behavior are implemented and tested."
    evidence_ref: "tests/test_srs_receipts.py"
    assertion_status: "validated"
  - gate_id: "independent_verifier_compatibility_PASS"
    description: "Serialized receipts and trust material are compatible with independent ARCS Verify report contracts."
    evidence_ref: "packages/dagr-mcp-sdk-v2/tests/test_arcs_verify_v0_2_acceptance.py"
    assertion_status: "validated"
  - gate_id: "enforced_refused_deferred_non_execution_PASS"
    description: "Refused and deferred calls stop before delegate or handler execution."
    evidence_ref: "tests/test_enforcement_harness.py"
    assertion_status: "validated"
  - gate_id: "public_release_guard_PASS"
    description: "Repository release guard remains required and passing for lane close."
    evidence_ref: "tools/check_public_release.py"
    assertion_status: "validated"
  - gate_id: "packaging_status_PASS"
    description: "Package inventory checks cover root and extracted packages without weakening guards."
    evidence_ref: "tests/test_packaging_inventories.py"
    assertion_status: "validated"
failed_gates: []
not_applicable_gates:
  - gate_id: "certification_service_NOT_APPLICABLE"
    description: "DAGR MCP does not provide certification service semantics."
    evidence_ref: "README.md"
    assertion_status: "not_applicable"
test_command_refs:
  - id: "focused-ecosystem-tests"
    command: ".venv/bin/python -m pytest tests/test_ecosystem_declarations.py -q"
    assertion_status: "validated"
  - id: "full-repository-tests"
    command: ".venv/bin/python -m pytest -q"
    assertion_status: "validated"
  - id: "public-release-guard"
    command: ".venv/bin/python tools/check_public_release.py ."
    assertion_status: "validated"
proof_pack_refs: []
unresolved_exceptions:
  - "reproducible_integration_PARTIAL"
  - "cross_binding_portability_PARTIAL"
  - "naming_distribution_status_PARTIAL"
  - "L2_governed_action_protocol_authority_AMBIGUOUS"
evidence_refs:
  - id: "conformance-adjudication"
    path: "docs/ECOSYSTEM_PILOT_ADJUDICATION.md"
    authority: "dagr-mcp"
    relationship: "projects"
  - id: "ecosystem-tests"
    path: "tests/test_ecosystem_declarations.py"
    authority: "dagr-mcp"
    relationship: "validates"
integrity: {}
notes: >-
  Dimension-level status remains more precise than a single A-E label. The
  projected C level reflects evidence conformance, independent verifier
  compatibility, and enforced non-execution; reproducibility and portability
  remain partial.
